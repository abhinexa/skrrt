<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f7f4;
      --text: #1a1a18;
      --muted: #7a7870;
      --border: #dddbd5;
      --accent: #2b2b28;
    }

    html { font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
    }

    .card {
      max-width: 520px;
      width: 100%;
      animation: fadeUp 0.7s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--accent);
  overflow: hidden;
  padding: 0;
  margin-bottom: 2rem;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.6rem;
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .role {
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 400;
      margin-bottom: 2rem;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin-bottom: 2rem;
    }

    .bio {
      font-size: 1rem;
      line-height: 1.8;
      color: #4a4a47;
      margin-bottom: 2.5rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0.3rem 0.85rem;
      margin-bottom: 2.5rem;
    }

    .status::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #c4a35a;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .link {
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 400;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 1rem;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .link:hover {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .link svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.75rem;
      color: var(--border);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <main>
    <div class="card">
      <div class="avatar">  <img src="HFEZfSFXYAAa2Nj.jpg" alt="A" />
</div>
      <h1>A</h1>
      <p class="role">Ba Ba Black Sheep</p>
      <div class="divider"></div>
      <p class="bio">
        Currently unemployed and open to new opportunities.
        Yes sir, yes sir, three bags full.
      </p>
      <div class="status">Open to work</div>
      <div class="links">
        <a href="mailto:hello@example.com" class="link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>
          Email
        </a>
        <a href="https://www.linkedin.com/in/abhinav-verma-a22513376/" target="_blank" class="link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="4"/><path d="M7 10v7M7 7v.01M11 10v7m0-5a3 3 0 0 1 6 0v5"/></svg>
          LinkedIn
        </a>
        <a href="https://github.com/abhinexa" target="_blank" class="link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
          GitHub
        </a>
      </div>
    </div>
  </main>

  <footer>© 2026 A</footer>

</body>
</html>
